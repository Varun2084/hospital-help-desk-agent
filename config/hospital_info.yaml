# Aam sawaalon ke jawab (FAQ). DEMO DATA: sab jaankari kalpanik hai.
# Asli deployment me har jawab hospital ke official source se lein, "source" bharein
# aur "verified_on" me woh tareekh likhein jab jawab aakhri baar jaancha gaya.

hospital_name: Demo Public Hospital, New Delhi
disclaimer: >-
  Yeh ek demo project hai. Timings aur niyam kalpanik hain; asli jaankari ke liye
  hospital ki official website ya helpdesk se puchhein.

helpdesk: Helpdesk counter, Main OPD Block, ground floor (demo)

topics:
  - id: registration
    keywords: [registration, register, card, uhid, panjikaran, पंजीकरण, रजिस्ट्रेशन, रजिस्टर, कार्ड, पर्ची]
    answer: >-
      Naye patient ko pehle registration counter ya online portal par registration karna hota hai.
      Registration ke baad ek patient ID milti hai, jo har visit par chahiye.
    source: demo
    verified_on: 2026-11-13

  - id: documents
    keywords: [document, documents, id proof, aadhaar, kagaz, दस्तावेज़, डॉक्यूमेंट, आधार, कागज़, कागज]
    answer: >-
      Ek photo ID (jaise Aadhaar), purani reports aur dawaiyon ki list saath laayein.
    source: demo
    verified_on: 2026-11-13

  - id: visiting_hours
    keywords: [visiting, visitor, milne, ward, मिलने, मुलाक़ात, मुलाकात, वार्ड]
    answer: >-
      Ward me visitors ke liye shaam 4 se 6 baje (demo timing). Ek samay par ek attendant pass ke saath.
    source: demo
    verified_on: 2026-11-13

  - id: emergency
    keywords: [emergency, casualty, ambulance, aapatkal, आपातकाल, इमरजेंसी, एम्बुलेंस, कैजुअल्टी]
    answer: >-
      Emergency 24x7 khuli rehti hai aur iske liye appointment nahin chahiye. Jaan ka khatra ho to
      turant 112 par call karein.
    source: demo
    verified_on: 2026-11-13

  - id: pharmacy
    keywords: [pharmacy, medicine, dawai, chemist, दवाई, दवा, फार्मेसी, मेडिकल स्टोर]
    answer: >-
      Hospital pharmacy OPD block ke ground floor par hai (demo location).
    source: demo
    verified_on: 2026-11-13
  - id: radiology
    keywords: [x-ray, xray, x ray, ultrasound, ct scan, mri, radiology, एक्स-रे, एक्सरे, एक्स रे, अल्ट्रासाउंड, सीटी स्कैन, एमआरआई]
    answer: >-
      X-ray, ultrasound, CT aur MRI ke liye pehle doctor ki parchi (request slip) chahiye.
      Parchi ke saath Radiology counter par jaakar samay lein. Bina parchi ke jaanch nahin hoti.
    source: demo
    verified_on: 2026-11-15