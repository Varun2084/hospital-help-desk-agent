name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip check
      - name: Config check
        run: python scripts/manage_departments.py validate
      - name: Unit tests (API key nahin chahiye)
        run: pytest -q
      - name: Booking flows against the HIS sandbox (synthetic)
        run: python scripts/demo_flows.py
      - name: Login and My Appointments access checks (synthetic)
        run: python scripts/demo_access.py
      - name: Notification flows (synthetic)
        run: python scripts/demo_notifications.py
      - name: Release gate (agent evaluation, scripted model)
        run: python -m evals.runner
      - name: Evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-scripted
          path: evals/results/
