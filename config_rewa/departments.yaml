# OPD ke din aur samay SSMC ke OPD Services page se hain (08 AM - 04 PM, Mon-Sat), department-wise nahin.
# Nephrology, Neonatology aur Pulmonary Medicine ek news report (indiamedtoday.com, 8 Oct 2020) se hain;
# website par nahin hain, isliye abhi chal rahe hain ya nahin, iski pushti baaki hai.
# Floor, slot ka samay aur keywords ANUMAAN hain. Asli istemaal se pehle hospital se pushti zaroori hai.

